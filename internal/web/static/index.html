<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aerofilt — Biofilter Filter Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">AEROFILT</div>
    <p class="tag">Hot isostatic pressing filter backwash &amp; temperature control</p>
  </header>
  <main>
    <section class="panel" id="status-panel">
      <h1>Filter status</h1>
      <pre id="status">loading…</pre>
    </section>
    <section class="panel">
      <h2>Temperature zones</h2>
      <div id="zones" class="zones"></div>
    </section>
    <section class="panel actions">
      <h2>Controls</h2>
      <button id="btn-refresh" type="button">Refresh</button>
      <button id="btn-estop" type="button" class="danger">Emergency stop</button>
      <button id="btn-clear" type="button">Clear E-stop</button>
    </section>
    <section class="panel">
      <h2>Alarms</h2>
      <ul id="alarms"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
